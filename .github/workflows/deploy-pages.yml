name: Deploy Astra static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site only
        run: |
          mkdir -p _site
          cp index.html app.css astra.css app.js core.js tools.js update.js sw.js VERSION version.json manifest.webmanifest apple-touch-icon.png .nojekyll _site/
          cp -a icons _site/icons
          cp -a scan _site/scan
          cp -a reel _site/reel
          cp -a builder _site/builder
          cp -a extensions _site/extensions
          # docs optional (screenshots) — skip large docs to keep deploy light
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
